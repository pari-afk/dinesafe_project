name: Keep Streamlit App Awake

on:
  schedule:
    # Every 6 hours, comfortably under Streamlit's 12-hour sleep threshold
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -sS https://dinesafe-project.streamlit.app --max-time 30 || true
